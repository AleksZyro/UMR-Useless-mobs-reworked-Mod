name: Build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Verify active project truth
        run: python tools/verify_umr_project_truth.py

      - name: Build Frost Stray v2 preview assets
        run: python tools/frost_stray_v2/build_assets.py --check

      - name: Rebuild deterministic exact textures
        run: python tools/mob_tripo/build_quality_textures.py --all

      - name: Run Python regression suite
        run: python -m pytest -q

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run pure Java timeline regression
        shell: bash
        run: |
          mkdir -p build/timeline-clock-test
          javac -d build/timeline-clock-test \
            src/main/java/com/Momik/usless_mobs/ability/FrostStrayTimelineClock.java \
            tools/java_tests/FrostStrayTimelineClockTest.java
          java -ea -cp build/timeline-clock-test \
            com.Momik.usless_mobs.ability.FrostStrayTimelineClockTest

      - name: Build Forge mod
        run: ./gradlew clean build --no-daemon

      - name: Dedicated server startup smoke test
        shell: bash
        run: |
          set +e
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          timeout --signal=TERM --kill-after=20s 120s ./gradlew runServer --no-daemon > dedicated-server.log 2>&1
          status=$?
          set -e
          if ! grep -Fq "Done (" dedicated-server.log; then
            cat dedicated-server.log
            exit 1
          fi
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            cat dedicated-server.log
            exit "$status"
          fi

      - name: Upload dedicated server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dedicated-server-${{ github.sha }}
          path: dedicated-server.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: umr-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
